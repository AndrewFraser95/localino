<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LocaLino Till</title>
<meta name="description" content="Order till for LocaLino Pizza">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15110D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LocaLino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/archivo-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <div class="top">
    <header class="bar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" rx="112" fill="#C2371F"/>
          <g stroke-linejoin="round" stroke-linecap="round">
            <path d="M126 176H386L256 420Z" fill="#F2A93B" stroke="#F2A93B" stroke-width="22"/>
            <rect x="104" y="112" width="304" height="56" rx="28" fill="#F8E6B8"/>
            <circle cx="212" cy="238" r="27" fill="#8E2415"/><circle cx="304" cy="246" r="25" fill="#8E2415"/><circle cx="258" cy="326" r="22" fill="#8E2415"/>
          </g>
        </svg>
        <div class="wordmark">Loca<b>Lino</b><small>Order till</small></div>
        <span class="net" id="net" hidden>Offline · orders are saved</span>
      </div>
      <div class="orow hbtns">
        <button class="btn sm" data-act="printer" type="button" aria-label="Printer">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/></svg>
          <span class="lbl">Printer</span><span class="pdot" id="pdot"></span>
        </button>
        <button class="btn sm" data-act="dash" type="button" aria-label="Dashboard">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span class="lbl">Dashboard</span>
        </button>
        <button class="btn sm" data-act="history" type="button" aria-label="Orders">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span class="lbl">Orders today</span> <span class="tcount" id="hcount">0</span>
        </button>
        <button class="btn sm" id="menubtn" data-act="settings" type="button" aria-label="Menu and prices">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="lbl">Menu &amp; prices</span><span class="tcount" id="menuflag" hidden>!</span>
        </button>
      </div>
    </header>
    <div class="upd" id="upd" hidden><span>A new version is ready. Update when you are between orders.</span><button class="btn sm" type="button" data-act="update">Update now</button></div>
    <div class="banner" id="banner" hidden></div>
  </div>
  <div class="main">
    <section class="menu" aria-label="Menu">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="items" id="items"></div>
    </section>
    <aside class="order" id="order" aria-label="Current order">
      <div class="ohead">
        <div class="orow">
          <button class="btn sm only-narrow" data-act="closeOrder" type="button">&lsaquo; Menu</button>
          <h2 class="otitle">Order <span class="num" id="onum">1</span></h2>
          <button class="btn sm ghost danger" id="btn-clear" data-act="clear" type="button">Clear</button>
        </div>
        <input class="in" id="label" placeholder="Name or table (optional)" autocomplete="off" maxlength="40">
      </div>
      <ul class="lines" id="lines"></ul>
      <div class="ofoot">
        <div class="tot"><span>Total</span><span class="num" id="total">£0.00</span></div>
        <div class="obtns">
          <button class="btn" id="btn-ticket" data-act="ticket" type="button">Chef ticket</button>
          <button class="btn primary" id="btn-pay" data-act="pay" type="button">Take payment</button>
        </div>
      </div>
    </aside>
  </div>
  <button class="mbar" id="mbar" data-act="openOrder" type="button">
    <span id="mcount">Order is empty</span><span class="num" id="mtotal">£0.00</span>
  </button>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript><p style="padding:24px;font-family:system-ui">The till needs JavaScript turned on.</p></noscript>
<script src="firebase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
